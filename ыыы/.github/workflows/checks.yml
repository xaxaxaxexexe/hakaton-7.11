name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: SQLite, catalog, access and payment tests (no real charges)
        run: python -m unittest discover -s tests -v
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_contract.py
      - run: python scripts/smoke_mock.py
      - name: Validate OpenAPI
        run: |
          python -m pip install openapi-spec-validator==0.7.2
          python -m openapi_spec_validator contracts/openapi.json
          python -m openapi_spec_validator contracts/openapi.runtime.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
