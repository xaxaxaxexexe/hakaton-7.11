# Existing TLS termination forwards HTTP/1.1 to 8080 and HTTP/2 to 8081.
server {
    listen 80;
    server_name cinema.makhkets.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://cinema.makhkets.ru$request_uri; }
}
server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081 http2;
    server_name cinema.makhkets.ru;
    root /opt/zal/current/apps/web/dist;
    index index.html;
    access_log off;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /__mock/ { return 404; }
    location ~ /\. { return 404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /media/ { expires 1h; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
